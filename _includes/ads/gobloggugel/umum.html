<script>
(function () {
  const host = location.hostname.toLowerCase();

  if (!(host === "admintfusion.my.id" || host.endsWith(".admintfusion.my.id"))) {
    return;
  }

  document.querySelectorAll(".admintfusion-banner[data-banner]").forEach(async function (box) {

    const banner = box.dataset.banner;

    try {
      const res = await fetch(`/assets/ads/admintfusion/banner/${banner}.html`, {
        cache: "no-cache"
      });

      if (!res.ok) return;

      box.innerHTML = await res.text();

      box.querySelectorAll("script").forEach(function (oldScript) {
        const s = document.createElement("script");

        [...oldScript.attributes].forEach(function (attr) {
          s.setAttribute(attr.name, attr.value);
        });

        s.textContent = oldScript.textContent;

        oldScript.replaceWith(s);
      });

    } catch (e) {}
  });

})();
</script>
