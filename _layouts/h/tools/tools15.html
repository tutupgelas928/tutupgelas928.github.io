
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Builder</title>
    <meta name="description" content="Create mock API responses.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
<meta name="yandex-verification" content="b19a83b7fdfdfc3d" />
<meta name="yandex-verification" content="92529185b5b35b40" />
<meta name="yandex-verification" content="eecc5e489416176b" />
<meta name="yandex-verification" content="2e5aab8c900dd08f" />
<meta name="yandex-verification" content="df8734a3401c8f3f" />
<meta name="yandex-verification" content="b39b0583c6b135a0" />
    
    {% include head.html %}
</head>
<body data-page-name="API Builder" data-tool-id="api-builder">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>API Builder</h1>
                <p class="tool-intro">Create mock API response JSON.</p>
                
                <div class="tool-box">
                    <label>Field Name (comma separated)</label>
                    <input type="text" id="fields" placeholder="e.g., id, name, email, age">
                    
                    <label style="margin-top: 0.8rem;">Number of Records</label>
                    <input type="number" id="count" value="5" min="1" max="100">
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="generate()">Generate</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                        <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>API Response</label>
                    <div class="output-box" id="apiOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function generate() {
            const fields = document.getElementById('fields').value.split(',').map(f => f.trim()).filter(f => f);
            const count = parseInt(document.getElementById('count').value) || 5;
            
            if (fields.length === 0) { alert('Enter field names.'); return; }
            
            const data = [];
            for (let i = 0; i < count; i++) {
                const record = {};
                fields.forEach((field, index) => {
                    if (field === 'id') record[field] = i + 1;
                    else if (field === 'name') record[field] = `User ${i + 1}`;
                    else if (field === 'email') record[field] = `user${i + 1}@example.com`;
                    else if (field === 'age') record[field] = Math.floor(Math.random() * 50) + 18;
                    else record[field] = `${field}_${i + 1}`;
                });
                data.push(record);
            }
            
            const response = {
                status: 'success',
                message: 'Data retrieved successfully',
                data: data,
                total: data.length
            };
            
            document.getElementById('apiOutput').textContent = JSON.stringify(response, null, 2);
        }
        
        function copyResult() {
            const t = document.getElementById('apiOutput').textContent;
            if (t === '-') { alert('Generate first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        function clearAll() {
            document.getElementById('fields').value = '';
            document.getElementById('count').value = 5;
            document.getElementById('apiOutput').textContent = '-';
        }
    </script>
</body>
</html>
