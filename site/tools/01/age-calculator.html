<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <meta name="description" content="Free online age calculator. Calculate exact age in years, months, days.">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body data-page-name="Age Calculator" data-tool-id="age-calculator">
    <div id="site-header"></div>
    <div id="breadcrumb"></div>
    
    <main class="tool-page">
        <h1>🎂 Age Calculator</h1>
        <p class="tool-intro">Calculate exact age in years, months, days, hours, minutes.</p>
        
        <div class="tool-box">
            <label style="font-weight:600;">Birth Date:</label>
            <input type="date" id="birthDate">
            
            <div style="margin-top:0.8rem;">
                <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                <button class="btn btn-secondary" onclick="clearDate()">Clear</button>
            </div>
            
            <div class="stats" style="margin-top:1.5rem;">
                <div class="stat-card"><div class="stat-number" id="years">-</div><div class="stat-label">Years</div></div>
                <div class="stat-card"><div class="stat-number" id="months">-</div><div class="stat-label">Months</div></div>
                <div class="stat-card"><div class="stat-number" id="days">-</div><div class="stat-label">Days</div></div>
                <div class="stat-card"><div class="stat-number" id="hours">-</div><div class="stat-label">Hours</div></div>
                <div class="stat-card"><div class="stat-number" id="minutes">-</div><div class="stat-label">Minutes</div></div>
            </div>
            
            <div class="output-box" id="result" style="text-align:center; white-space:normal;">
                Your exact age will appear here...
            </div>
        </div>
        
        <div id="ad-content" class="ad-container"></div>
        
        <section class="content-section">
            <h2>How to Use</h2>
            <ol>
                <li>Select birth date.</li>
                <li>Click Calculate.</li>
                <li>View exact age.</li>
            </ol>
        </section>
        
        <section class="content-section">
            <h2>Related Tools</h2>
            <div class="related-tools" id="related-tools"></div>
        </section>
    </main>
    
    <div id="site-footer"></div>
    
    <script>
        function calculate() {
            const bd = document.getElementById('birthDate').value;
            if (!bd) { alert('Select birth date first.'); return; }
            
            const birth = new Date(bd);
            const now = new Date();
            if (birth > now) { alert('Cannot be future date.'); return; }
            
            let y = now.getFullYear() - birth.getFullYear();
            let m = now.getMonth() - birth.getMonth();
            let d = now.getDate() - birth.getDate();
            let h = now.getHours() - birth.getHours();
            let min = now.getMinutes() - birth.getMinutes();
            
            if (min < 0) { min += 60; h--; }
            if (h < 0) { h += 24; d--; }
            if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
            if (m < 0) { m += 12; y--; }
            
            document.getElementById('years').textContent = y;
            document.getElementById('months').textContent = m;
            document.getElementById('days').textContent = d;
            document.getElementById('hours').textContent = h;
            document.getElementById('minutes').textContent = min;
            
            document.getElementById('result').textContent = 
                `You are ${y} years, ${m} months, ${d} days, ${h} hours, ${min} minutes old.`;
        }
        
        function clearDate() {
            document.getElementById('birthDate').value = '';
            ['years','months','days','hours','minutes'].forEach(id => document.getElementById(id).textContent = '-');
            document.getElementById('result').textContent = 'Your exact age will appear here...';
        }
    </script>
</body>
</html>
